name: Build Collabora CODE from Source

on:
  workflow_dispatch:        # allow manual trigger
  push:
    branches:
      - ci/builds           # or whichever branch you want builds from

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      DOCKER_BUILDKIT: 1
      DOCKER_HUB_REPO: ${{ secrets.DOCKER_HUB_REPO }}
      DOCKER_HUB_TAG: latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build from source
        working-directory: docker/from-source
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Tag image
        run: |
          docker tag mydomain/collaboraonline:latest $DOCKER_HUB_REPO:$DOCKER_HUB_TAG

      - name: Push image
        run: docker push $DOCKER_HUB_REPO:$DOCKER_HUB_TAG
